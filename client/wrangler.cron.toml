# Day-before reminder emails (cron/reminders.js). A separate Worker because Pages projects can't run on a schedule.
# Deploy with: npx wrangler deploy -c wrangler.cron.toml
name = "pgowp-reminders"
main = "cron/reminders.js"
compatibility_date = "2024-11-01"
workers_dev = false

[triggers]
# 14:00 UTC is 10 AM in New York during daylight saving time and 9 AM in winter.
crons = ["0 14 * * *"]
